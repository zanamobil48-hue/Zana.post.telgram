name: Zana Auto Post

on:
  schedule:
    - cron: '0 13 * * *'   # ١٦:٠٠ بەکاتی عێراق
    - cron: '0 15 * * *'   # ١٨:٠٠ بەکاتی عێراق
    - cron: '0 16 * * *'   # ١٩:٠٠ بەکاتی عێراق
    - cron: '0 17 * * *'   # ٢٠:٠٠ بەکاتی عێراق
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pillow gspread google-auth python-telegram-bot requests
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
